version: '3'

vars:
  APP: api
  CMD: ./cmd/api
  BIN_DIR: bin
  COMPOSE_FILE: deployments/docker-compose.yaml
  MIGRATIONS_DIR: migrations
  DATABASE_URL: postgres://postgres:postgres@localhost:5434/payments?sslmode=disable

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  build:
    desc: Compile the API binary
    cmds:
      - go build -o {{.BIN_DIR}}/{{.APP}} {{.CMD}}
    sources:
      - ./**/*.go
      - go.mod
      - go.sum
    generates:
      - '{{.BIN_DIR}}/{{.APP}}'

  run:
    desc: Run the API locally
    cmds:
      - go run {{.CMD}}

  tidy:
    desc: Sync go.mod/go.sum with imports
    cmds:
      - go mod tidy

  fmt:
    desc: Format Go code
    cmds:
      - gofmt -w .

  fmt:check:
    desc: Fail if any Go file is not gofmt-clean
    cmds:
      - |
        files=$(gofmt -l .)
        if [ -n "$files" ]; then
          echo "Not gofmt-clean:"
          echo "$files"
          exit 1
        fi

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  test:
    desc: Run all tests with the race detector
    cmds:
      - go test -race ./...

  test:unit:
    desc: Run unit tests only (tests/unit, no integration tag)
    cmds:
      - go test -race ./tests/unit/...

  test:integration:
    desc: Run DB/integration tests (requires Postgres)
    cmds:
      - go test -race -tags=integration ./tests/integration/...

  test:one:
    desc: 'Run a single test: task test:one TEST=TestX PKG=./tests/unit/model'
    vars:
      PKG: '{{.PKG | default "./tests/unit/..."}}'
    cmds:
      - go test -race -run {{.TEST}} {{.PKG}}

  cover:
    desc: Generate a coverage profile and print a function summary
    cmds:
      - go test -race -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out

  check:
    desc: vet + race tests
    cmds:
      - task: vet
      - task: test

  up:
    desc: Start API + Postgres via Docker Compose
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} up --build

  down:
    desc: Stop the Docker Compose stack
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} down

  migrate:up:
    desc: Apply all pending migrations
    cmds:
      - migrate -path {{.MIGRATIONS_DIR}} -database "{{.DATABASE_URL}}" up

  migrate:down:
    desc: Roll back the most recent migration
    cmds:
      - migrate -path {{.MIGRATIONS_DIR}} -database "{{.DATABASE_URL}}" down 1

  migrate:create:
    desc: 'Create a migration: task migrate:create -- add_payments'
    cmds:
      - migrate create -ext sql -dir {{.MIGRATIONS_DIR}} -seq {{.CLI_ARGS}}

  clean:
    desc: Remove build and coverage artifacts
    cmds:
      - rm -rf {{.BIN_DIR}} coverage.out

  loadtest:create:
    desc: Unique-key paced create (default 15 RPS / 1m). Requires API_KEY.
    vars:
      RATE: '{{.RATE | default "15"}}'
      DURATION: '{{.DURATION | default "1m"}}'
      BASE_URLS: '{{.BASE_URLS | default "http://localhost:8080"}}'
      BANK_DELAY_MS: '{{.BANK_DELAY_MS | default "200"}}'
      BANK_MIX: '{{.BANK_MIX | default "pinned 100/0/0/0"}}'
    cmds:
      - |
        if [ -z "{{.API_KEY}}" ]; then echo "API_KEY is required"; exit 1; fi
        go run ./cmd/loadtest create \
          --api-key "{{.API_KEY}}" \
          --base-urls "{{.BASE_URLS}}" \
          --rate {{.RATE}} \
          --duration {{.DURATION}} \
          --database-url "{{.DATABASE_URL}}" \
          --db-pool 25 \
          --worker-pool 4 \
          --bank-delay-ms {{.BANK_DELAY_MS}} \
          --bank-mix "{{.BANK_MIX}}"

  loadtest:create:two:
    desc: Unique-key create against two API processes (:8080 and :8081)
    cmds:
      - task: loadtest:create
        vars:
          API_KEY: '{{.API_KEY}}'
          RATE: '{{.RATE | default "15"}}'
          DURATION: '{{.DURATION | default "1m"}}'
          BASE_URLS: http://localhost:8080,http://localhost:8081
          BANK_DELAY_MS: '{{.BANK_DELAY_MS | default "200"}}'
          BANK_MIX: '{{.BANK_MIX | default "pinned 100/0/0/0"}}'

  loadtest:storm:
    desc: Shared-key paced create (default 15 RPS / 1m). Requires API_KEY.
    vars:
      RATE: '{{.RATE | default "15"}}'
      DURATION: '{{.DURATION | default "1m"}}'
      STORM_KEYS: '{{.STORM_KEYS | default "20"}}'
      BANK_DELAY_MS: '{{.BANK_DELAY_MS | default "200"}}'
      BANK_MIX: '{{.BANK_MIX | default "pinned 100/0/0/0"}}'
    cmds:
      - |
        if [ -z "{{.API_KEY}}" ]; then echo "API_KEY is required"; exit 1; fi
        go run ./cmd/loadtest storm \
          --api-key "{{.API_KEY}}" \
          --base-urls "{{.BASE_URLS | default "http://localhost:8080"}}" \
          --rate {{.RATE}} \
          --duration {{.DURATION}} \
          --storm-keys {{.STORM_KEYS}} \
          --database-url "{{.DATABASE_URL}}" \
          --db-pool 25 \
          --worker-pool 4 \
          --bank-delay-ms {{.BANK_DELAY_MS}} \
          --bank-mix "{{.BANK_MIX}}"

  loadtest:refund:
    desc: Capture then concurrent full-amount refunds. Requires API_KEY.
    vars:
      PAYMENTS: '{{.PAYMENTS | default "10"}}'
      REFUNDS_PER: '{{.REFUNDS_PER | default "8"}}'
      BANK_DELAY_MS: '{{.BANK_DELAY_MS | default "200"}}'
      BANK_MIX: '{{.BANK_MIX | default "pinned 100/0/0/0"}}'
    cmds:
      - |
        if [ -z "{{.API_KEY}}" ]; then echo "API_KEY is required"; exit 1; fi
        go run ./cmd/loadtest refund \
          --api-key "{{.API_KEY}}" \
          --base-urls "{{.BASE_URLS | default "http://localhost:8080"}}" \
          --payments {{.PAYMENTS}} \
          --refunds-per {{.REFUNDS_PER}} \
          --database-url "{{.DATABASE_URL}}" \
          --db-pool 25 \
          --worker-pool 4 \
          --bank-delay-ms {{.BANK_DELAY_MS}} \
          --bank-mix "{{.BANK_MIX}}"

  loadtest:mix:
    desc: Modest unique-key create against the default 90/5/3/2 bank mix. Requires API_KEY.
    vars:
      RATE: '{{.RATE | default "5"}}'
      DURATION: '{{.DURATION | default "1m"}}'
    cmds:
      - |
        if [ -z "{{.API_KEY}}" ]; then echo "API_KEY is required"; exit 1; fi
        go run ./cmd/loadtest mix \
          --api-key "{{.API_KEY}}" \
          --base-urls "{{.BASE_URLS | default "http://localhost:8080"}}" \
          --rate {{.RATE}} \
          --duration {{.DURATION}} \
          --database-url "{{.DATABASE_URL}}" \
          --db-pool 25 \
          --worker-pool 4 \
          --bank-delay-ms 0 \
          --bank-mix "default 90/5/3/2" \
          --max-attempts 5
