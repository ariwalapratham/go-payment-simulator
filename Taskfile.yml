version: '3'

vars:
  APP: api
  CMD: ./cmd/api
  BIN_DIR: bin
  COMPOSE_FILE: deployments/docker-compose.yaml
  MIGRATIONS_DIR: migrations
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/payments?sslmode=disable

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  build:
    desc: Compile the API binary
    cmds:
      - go build -o {{.BIN_DIR}}/{{.APP}} {{.CMD}}
    sources:
      - ./**/*.go
      - go.mod
      - go.sum
    generates:
      - '{{.BIN_DIR}}/{{.APP}}'

  run:
    desc: Run the API locally
    cmds:
      - go run {{.CMD}}

  tidy:
    desc: Sync go.mod/go.sum with imports
    cmds:
      - go mod tidy

  fmt:
    desc: Format Go code
    cmds:
      - gofmt -w .

  fmt:check:
    desc: Fail if any Go file is not gofmt-clean
    cmds:
      - |
        files=$(gofmt -l .)
        if [ -n "$files" ]; then
          echo "Not gofmt-clean:"
          echo "$files"
          exit 1
        fi

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  lint:
    desc: Run golangci-lint with the repo config
    cmds:
      - golangci-lint run ./...

  test:
    desc: Run all tests with the race detector
    cmds:
      - go test -race ./...

  test:unit:
    desc: Run unit tests only (no DB/HTTP)
    cmds:
      - go test -race ./internal/...

  test:integration:
    desc: Run DB/integration tests (requires Postgres)
    cmds:
      - go test -race -tags=integration ./test/integration/...

  test:one:
    desc: 'Run a single test: task test:one TEST=TestX PKG=./internal/service'
    vars:
      PKG: '{{.PKG | default "./..."}}'
    cmds:
      - go test -race -run {{.TEST}} {{.PKG}}

  cover:
    desc: Generate a coverage profile and print a function summary
    cmds:
      - go test -race -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out

  check:
    desc: fmt + vet + lint + race tests (pre-commit gate)
    cmds:
      - task: fmt:check
      - task: vet
      - task: lint
      - task: test

  up:
    desc: Start API + Postgres via Docker Compose
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} up --build

  down:
    desc: Stop the Docker Compose stack
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} down

  migrate:up:
    desc: Apply all pending migrations
    cmds:
      - migrate -path {{.MIGRATIONS_DIR}} -database "{{.DATABASE_URL}}" up

  migrate:down:
    desc: Roll back the most recent migration
    cmds:
      - migrate -path {{.MIGRATIONS_DIR}} -database "{{.DATABASE_URL}}" down 1

  migrate:create:
    desc: 'Create a migration: task migrate:create -- add_payments'
    cmds:
      - migrate create -ext sql -dir {{.MIGRATIONS_DIR}} -seq {{.CLI_ARGS}}

  clean:
    desc: Remove build and coverage artifacts
    cmds:
      - rm -rf {{.BIN_DIR}} coverage.out
