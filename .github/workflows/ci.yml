name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: payments
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d payments"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: true
      PAYMENTS_PRIMARY_ENV: test
      PAYMENTS_SERVER_PORT: "8080"
      PAYMENTS_SERVER_READ_TIMEOUT: "5"
      PAYMENTS_SERVER_WRITE_TIMEOUT: "10"
      PAYMENTS_SERVER_IDLE_TIMEOUT: "60"
      PAYMENTS_SERVER_CORS_ALLOWED_ORIGINS: http://localhost:3000
      PAYMENTS_DATABASE_HOST: localhost
      PAYMENTS_DATABASE_PORT: "5434"
      PAYMENTS_DATABASE_USER: postgres
      PAYMENTS_DATABASE_PASSWORD: postgres
      PAYMENTS_DATABASE_NAME: payments
      PAYMENTS_DATABASE_SSL_MODE: disable
      PAYMENTS_DATABASE_MAX_OPEN_CONNS: "25"
      PAYMENTS_DATABASE_MAX_IDLE_CONNS: "25"
      PAYMENTS_DATABASE_CONN_MAX_LIFETIME: "300"
      PAYMENTS_DATABASE_CONN_MAX_IDLE_TIME: "60"
      PAYMENTS_ADMIN_API_KEY: test-admin-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test -race ./tests/unit/...

      - name: Integration tests
        run: go test -race -tags=integration ./tests/integration/...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0
